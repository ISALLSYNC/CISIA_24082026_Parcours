# [PÉDAGOGIE] ============================================================================
# [PÉDAGOGIE] FICHIER — .pre-commit-config.yaml
# [PÉDAGOGIE] MODULE  — M23–M24 — qualité au plus près du développeur
# [PÉDAGOGIE] RÔLE    — Exécuter automatiquement des contrôles courts avant qu'un commit ne soit
# [PÉDAGOGIE]           enregistré.
# [PÉDAGOGIE] THÉORIE — déplacer la détection d'erreur vers la gauche réduit le coût de correction
# [PÉDAGOGIE]           • chaque hook doit être déterministe et partageable avec la CI
# [PÉDAGOGIE]           • le formatage automatique sépare le style de la logique métier
# [PÉDAGOGIE] À VOIR  — Un commit n'est créé que si tous les hooks applicables réussissent.
# [PÉDAGOGIE] PIÈGE   — Contourner les hooks masque une dette ; ce n'est pas une correction.
# [PÉDAGOGIE] GARDE   — Toutes les lignes marquées [PÉDAGOGIE] sont des commentaires : elles
# [PÉDAGOGIE]           guident la lecture sans changer l'exécution.
# [PÉDAGOGIE] ============================================================================

# [PÉDAGOGIE] CLÉ `repos` — ce champ déclaratif participe au contrat de configuration.
repos:
  # [PÉDAGOGIE] CLÉ `repo` — ce champ déclaratif participe au contrat de configuration.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # [PÉDAGOGIE] CLÉ `rev` — ce champ déclaratif participe au contrat de configuration.
    # [PÉDAGOGIE] ALIGNEMENT (M29, 12/10/2026) — v0.6.9 → v0.15.20 = la version de ruff verrouillée
    # [PÉDAGOGIE]           dans uv.lock (celle de la CI). pre-commit télécharge SA propre copie de
    # [PÉDAGOGIE]           l'outil d'après ce `rev` : il ne lit pas uv.lock. Si les deux divergent,
    # [PÉDAGOGIE]           le hook et la CI peuvent rendre des verdicts contradictoires.
    # [PÉDAGOGIE]           → À chaque mise à jour de ruff dans uv.lock, mettre ce `rev` à jour aussi.
    rev: v0.15.20
    # [PÉDAGOGIE] CLÉ `hooks` — ce champ déclaratif participe au contrat de configuration.
    hooks:
      # [PÉDAGOGIE] CLÉ `id` — ce champ déclaratif participe au contrat de configuration.
      - id: ruff
        # [PÉDAGOGIE] CLÉ `args` — ce champ déclaratif participe au contrat de configuration.
        args: [--fix]
  # [PÉDAGOGIE] CLÉ `repo` — ce champ déclaratif participe au contrat de configuration.
  - repo: https://github.com/psf/black
    # [PÉDAGOGIE] CLÉ `rev` — ce champ déclaratif participe au contrat de configuration.
    # [PÉDAGOGIE] ALIGNEMENT (M29, 12/10/2026) — 24.8.0 → 26.5.1 = la version de black de uv.lock.
    # [PÉDAGOGIE]           Incident à l'origine : au push, black 24.8.0 (hook) voulait reformater
    # [PÉDAGOGIE]           scripts/demo_prefect_idempotence.py, que black 26.5.1 (CI) accepte tel quel.
    rev: 26.5.1
    # [PÉDAGOGIE] CLÉ `hooks` — ce champ déclaratif participe au contrat de configuration.
    hooks:
      # [PÉDAGOGIE] CLÉ `id` — ce champ déclaratif participe au contrat de configuration.
      - id: black
  # [PÉDAGOGIE] CLÉ `repo` — ce champ déclaratif participe au contrat de configuration.
  - repo: https://github.com/gitleaks/gitleaks
    # [PÉDAGOGIE] CLÉ `rev` — ce champ déclaratif participe au contrat de configuration.
    rev: v8.18.4
    # [PÉDAGOGIE] CLÉ `hooks` — ce champ déclaratif participe au contrat de configuration.
    hooks:
      # [PÉDAGOGIE] CLÉ `id` — ce champ déclaratif participe au contrat de configuration.
      - id: gitleaks
